<style>
/* Layout: one column, cards for questions, a bottom bar for Back/Next. Hearts are pink, hills are green, the type card is ink. */
:root {
  --bg: #f5f1fa; --card: #ffffff; --ink: #241a3a; --muted: #6c6383; --line: #e2dbec;
  --heart: #d6336c; --heart-soft: #fde4ee; --hill: #2f7d5c; --hill-soft: #dff1e7; --them: #3d6fd6; --them-soft: #e2eafb;
  --type-bg: #241a3a; --type-ink: #fdf8ff; --type-muted: #cbbfe0;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141019; --card: #1d1726; --ink: #efe9f7; --muted: #a99fbd; --line: #352c45;
    --heart: #ff7aa8; --heart-soft: #3b1f2d; --hill: #6cc79b; --hill-soft: #1b3328; --them: #8fb1ff; --them-soft: #1c2742;
    --type-bg: #2b2140; --type-ink: #fdf8ff; --type-muted: #cbbfe0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141019; --card: #1d1726; --ink: #efe9f7; --muted: #a99fbd; --line: #352c45;
  --heart: #ff7aa8; --heart-soft: #3b1f2d; --hill: #6cc79b; --hill-soft: #1b3328; --them: #8fb1ff; --them-soft: #1c2742;
  --type-bg: #2b2140; --type-ink: #fdf8ff; --type-muted: #cbbfe0; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
#app { max-width: 680px; margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; line-height: 1.1; margin: 0; }
h1 { font-size: clamp(40px, 10vw, 64px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 26px; font-weight: 800; }
h3 { font-size: 20px; font-weight: 700; }
h4 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
h1:focus, h2:focus { outline: none; }
p { margin: 0; }
section { display: grid; gap: 16px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.eyebrow.heart { color: var(--heart); } .eyebrow.hill { color: var(--hill); }
.lede { font-size: 19px; max-width: 60ch; }
.sub, .note, .rule { color: var(--muted); max-width: 60ch; }
.rule { font-size: 14px; }
.amp { color: var(--heart); font-weight: 500; }
.intro { padding-top: 24px; gap: 20px; }
.facts { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.facts li { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; display: flex; gap: 6px; align-items: baseline; }
.facts b { font-family: var(--display); font-size: 20px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: 700 16px var(--body); border-radius: 999px; padding: 11px 20px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.big { font-size: 19px; padding: 14px 30px; }
.btn.ghost { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.resetbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); }
.resetbar .btn { font-size: 14px; padding: 8px 12px; color: var(--muted); }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--heart); outline-offset: 2px; }
.progress { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--heart); border-radius: 999px; transition: width 0.3s; }
.items { display: grid; gap: 12px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.stmt { font-size: 19px; font-weight: 700; font-family: var(--display); line-height: 1.25; }
.scale5 { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 0 2px; }
.dot5 { border-radius: 50%; border: 2px solid var(--heart); background: transparent; cursor: pointer; padding: 0; flex: none; transition: transform 0.1s, background 0.1s; }
.dot5.s0 { width: 26px; height: 26px; } .dot5.s1 { width: 32px; height: 32px; } .dot5.s2 { width: 38px; height: 38px; }
.dot5.s3 { width: 44px; height: 44px; } .dot5.s4 { width: 50px; height: 50px; }
.dot5[aria-checked="true"] { background: var(--heart); transform: scale(1.08); box-shadow: 0 0 0 4px var(--heart-soft); }
.ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.hillbox .q { font-family: var(--display); font-weight: 700; font-size: 19px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.hnum { font: 700 12px var(--body); color: var(--muted); letter-spacing: 0.04em; }
.stops { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; position: relative; }
.stops::before { content: ""; position: absolute; left: 16.6%; right: 16.6%; top: 15px; height: 3px; background: var(--hill-soft); border-radius: 3px; }
.stop { position: relative; display: grid; justify-items: center; gap: 6px; text-align: center; background: none; border: 0; color: var(--ink); font: 15px/1.3 var(--body); cursor: pointer; padding: 4px 2px; border-radius: 10px; }
.stop .dot { width: 24px; height: 24px; border-radius: 50%; background: var(--card); border: 3px solid var(--hill); }
.stop[aria-checked="true"] .dot { background: var(--hill); box-shadow: 0 0 0 5px var(--hill-soft); }
.stop[aria-checked="true"] .lab { text-decoration: underline 2px var(--hill); text-underline-offset: 4px; }   /* not bold: bold rewraps and the row jumps */
.hilltools { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pass, .die { font: 700 14px var(--body); border-radius: 999px; padding: 6px 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.pass[aria-pressed="true"] { background: var(--line); color: var(--ink); }
.die[aria-pressed="true"] { background: var(--hill); border-color: var(--hill); color: var(--bg); }
.die:disabled { opacity: 0.4; cursor: not-allowed; }
.nav { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 75%, transparent); }
.count { color: var(--muted); font-size: 14px; text-align: center; flex: 1; }
.slots { list-style: none; counter-reset: slot; padding: 0; margin: 0; display: grid; gap: 8px; }
.slot { counter-increment: slot; display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--heart); border-radius: 12px; padding: 10px 12px; min-height: 52px; }
.slot::before { content: counter(slot); font: 800 20px var(--display); color: var(--heart); width: 20px; }
.slot.empty { border-style: dashed; border-color: var(--line); }
.slot.empty::before { color: var(--muted); }
.slot b { flex: 1; }
.hint { color: var(--muted); font-size: 14px; }
.tools { display: flex; gap: 4px; }
.mini { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; font-size: 14px; }
.mini:disabled { opacity: 0.3; cursor: default; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.chip { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--ink); cursor: pointer; display: grid; gap: 2px; font: 15px/1.3 var(--body); }
.chip span { color: var(--muted); font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--heart); background: var(--heart-soft); }
.chip:disabled { opacity: 0.4; cursor: not-allowed; }
.more summary { cursor: pointer; color: var(--muted); font-weight: 700; padding: 6px 0; }
.more .chips { margin-top: 8px; }
.results { gap: 28px; }
.typecard { background: var(--type-bg); color: var(--type-ink); border-radius: 20px; padding: 28px 22px; display: grid; gap: 10px; }
.typecard .eyebrow { color: var(--type-muted); }
.typecard h1 { font-size: clamp(36px, 9vw, 56px); }
.tline { font-size: 20px; }
.tfrom { color: var(--type-muted); }
/* draft 5: a close call shows both types inside the card and asks; a pick says so, with a way to change it */
.pick-row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 6px; }
.pick-opt { border: 1px solid color-mix(in srgb, var(--type-ink) 28%, transparent); border-radius: 14px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.pick-opt h2 { font-size: clamp(26px, 6vw, 34px); }
.pick-opt .btn { justify-self: start; margin-top: 4px; }
.typecard .btn.ghost { color: var(--type-ink); padding: 4px 6px; font-size: 15px; }
.block { gap: 12px; }
.top { margin: 0; padding: 0; list-style: none; counter-reset: top; display: grid; gap: 10px; }
.top li { counter-increment: top; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 14px 52px; position: relative; display: grid; gap: 2px; }
.top li::before { content: counter(top); position: absolute; left: 16px; top: 12px; font: 800 26px var(--display); color: var(--heart); }
.top b { font-family: var(--display); font-size: 20px; }
.vline { color: var(--muted); font-size: 14px; }
.bottom { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr) 3.2em; gap: 10px; align-items: center; font-size: 15px; }

.bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--muted); opacity: 0.7; }
.bar-row.lead .bar { background: var(--heart); opacity: 1; }
.bar-row.lead .bar-name { color: var(--heart); font-weight: 700; }
.bar-num { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.word { color: var(--heart); }
.group { display: grid; gap: 10px; margin-top: 6px; }
.stance { display: grid; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.stance .q { font-weight: 700; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 700; color: var(--bg); background: var(--hill); border-radius: 999px; padding: 1px 8px; }
.passed { color: var(--muted); font-style: italic; font-size: 14px; }
.leans { color: var(--hill); font-size: 13px; margin: 6px 0 0; }
.why { margin: 10px 0 14px; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.track { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; position: relative; }
.track::before { content: ""; position: absolute; left: 16.6%; right: 16.6%; top: 7px; height: 2px; background: var(--line); }
.tstop { position: relative; display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 13px; color: var(--muted); }
.tdot { width: 16px; height: 16px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); }

.tstop.them .tdot { box-shadow: 0 0 0 4px var(--them); }
.tstop.me, .tstop.them { color: var(--ink); font-weight: 700; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.codebox { display: grid; gap: 8px; }
.codebox label, .screen label { font-weight: 700; font-size: 14px; }
.coderow { display: flex; gap: 8px; }
.code, .name, textarea { font: 15px var(--body); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); color: var(--ink); min-width: 0; }
.code { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
textarea { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 13px; resize: vertical; }
.copied { color: var(--hill); font-size: 14px; min-height: 1.2em; }
.err { color: var(--heart); font-weight: 700; }
.cmp { display: grid; gap: 14px; margin-top: 8px; }
.agree { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.pct { font: 800 44px var(--display); color: var(--heart); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pair > div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.pair ol { margin: 0; padding-left: 20px; }
.pair li.shared { color: var(--heart); font-weight: 700; }
.tname { color: var(--muted); font-size: 14px; }
.key { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; }
.key.me { background: var(--hill); } .key.them { box-shadow: 0 0 0 3px var(--them); }
/* Draft 3: the sort, most and least, face-offs, sureness, and the compare page. */
.sortcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; display: grid; gap: 10px; min-height: 9em; align-content: center; }
.vname { font-size: 15px; color: var(--muted); }
.vname b { color: var(--heart); font-family: var(--display); font-size: 17px; }

.piles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pile { font: 700 16px var(--body); border-radius: 14px; padding: 14px 6px; min-height: 58px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.pile.p3 { border-color: var(--heart); } .pile.p2 { border-color: var(--heart-soft); } .pile.p0 { border-color: var(--muted); }
.pile.p3[aria-checked="true"] { background: var(--heart); color: var(--bg); }
.pile.p2[aria-checked="true"] { background: var(--heart-soft); border-color: var(--heart); }
.pile.p1[aria-checked="true"] { background: var(--line); border-color: var(--muted); }
.pile.p0[aria-checked="true"] { background: var(--muted); color: var(--bg); }
.piletally { color: var(--muted); font-size: 15px; }
.piletally b { color: var(--ink); font-variant-numeric: tabular-nums; }
.note.small { font-size: 14px; }
.picklist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.bw { display: grid; gap: 10px; }

.bwtext { display: grid; gap: 2px; }
.bwtext b { font-family: var(--display); font-size: 18px; }
.bwtext span { color: var(--muted); font-size: 14px; }
.bwbtns { display: grid; gap: 6px; }

.mark.up[aria-pressed="true"] { background: var(--heart); border-color: var(--heart); color: var(--bg); }

.dphrase { font: 700 20px/1.25 var(--display); }
.dname { color: var(--muted); font-size: 14px; }

.ev { color: var(--muted); font-size: 13px; }
.close { color: var(--muted); }
.corelist { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }

.typecard.small { padding: 16px; gap: 6px; }
.typecard.small h3 { font-size: 22px; }

<script>if (!/(\/|\.html?)$/.test(location.pathname)) history.replaceState(null, '', location.pathname + '/' + location.search + location.hash);</script>
<main id="app"><noscript>Wayfinder needs JavaScript to run.</noscript></main>
<script>
// core.js: the data and the logic of Wayfinder, a values type test (draft 5). No DOM here: the page uses it, and the tests run
// it in Node. Draft 5 adds one thing to draft 4: when the type is a close call between two pairs, the player picks.
// The top 5 is worked out from the answers, never picked by the player. Four kinds of answer feed it: a sort of the cards into
// piles with limits, screens of four where the player marks the most and the least like them, one-or-the-other face-offs among
// the leaders, and the same screens of four for the bottom of the sort. Draft 4: every card is a value, never one cause;
// every wish is sized (the world, or one's own life) and a face-off between sizes asks which is more you; every hill leans on
// two values, and a stance at either end adds a little to its value's area.
(function (root) {
  "use strict";

  // Ten areas. A type's name must fit every value in its areas, never only the best-known one: a type is earned by whichever
  // values in the area a person holds, so its name and line are written for all of them.
  const AREAS = [
    { key: "people", name: "Your people", line: "who you'd drop everything for" },
    { key: "self", name: "Being you", line: "the right to be your own" },
    { key: "kind", name: "Kindness", line: "how you treat whoever's in front of you" },

  // the end replaced a limit at every card, which cost a simulated agreeable player about 25 swaps.
  const PILES = ["not me", "a little", "yes", "so me"];
  const SOME = 3, NOTME = 0, MIN_PILE = 8, MAX_PILE = 12;
  const TOP_REPS = 4, BOTTOM_REPS = 3, PER_SCREEN = 4, DUELS = 12, BOTTOM_DUELS = 8;
  const SURE = 0.75, LIKELY = 0.6, CLOSE = 0.4;   // a top-5 value's chance of beating the number 6; a number 6 to 8 against the number 5
  const AGREE = [[85, "Basically the same heart"], [70, "Close"], [55, "Different flavors"], [-Infinity, "Opposites, maybe attracting"]];

  function seeded(seed) {
    return function () { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function shuffleWith(a, r) { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
  function shuffled(n, seed) { return shuffleWith(Array.from({ length: n }, (_, k) => k), seeded(seed)); }
  const ORDER = shuffled(VALUES.length, 265);          // the order the cards are sorted in, the same for everyone
  const RANK_OF = new Map(ORDER.map((v, k) => [v, k]));  // the last tie-break anywhere: the card's place in that order
  function setSeed(items) { return items.reduce((s, i) => (Math.imul(s, 31) + i + 7) | 0, 1009); }

  function mean(xs) { return xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : 0; }
  function lexLess(x, y) { for (let k = 0; k < x.length; k++) if (x[k] !== y[k]) return x[k] < y[k]; return false; }

  // Screens of four from a set of cards: every card on `reps` screens (a few on one more, to fill the last screens), no card
  // twice on a screen, pairs spread out, and the same screens every time for the same set, so a results code need not hold them.
  function screens(items, reps) {
    const n = items.length, nb = Math.ceil(n * reps / PER_SCREEN), r = seeded(setSeed(items.slice().sort((a, b) => a - b)));
    const order = shuffleWith(items.slice().sort((a, b) => a - b), r);
    const quota = new Map(order.map(i => [i, reps]));
    for (let e = 0; e < nb * PER_SCREEN - n * reps; e++) quota.set(order[e % n], quota.get(order[e % n]) + 1);
    const seen = new Map(order.map(i => [i, 0])), co = new Map();
    const key = (a, b) => a < b ? a + "," + b : b + "," + a;
    // A pair kept apart gets its screens first, spread out and never shared; the rest fill around them. (A greedy fill alone
    // can paint itself into a corner: in a set of 8, each of the two needs half the screens.)
    const fixed = Array.from({ length: nb }, () => []);
    const spread = (list, q) => Array.from({ length: Math.min(q, list.length) }, (_, k) => list[Math.floor(k * list.length / Math.min(q, list.length))]);
    for (const [x, y] of KEEP_APART.map(([a, c]) => [VALUES.find(v => v.name === a).i, VALUES.find(v => v.name === c).i]).filter(([x, y]) => items.includes(x) && items.includes(y))) {
      const all = Array.from({ length: nb }, (_, b) => b), bx = spread(all, quota.get(x)), by = spread(all.filter(b => !bx.includes(b)), quota.get(y));
      bx.forEach(b => fixed[b].push(x)); by.forEach(b => fixed[b].push(y));
      quota.set(x, quota.get(x) - bx.length); quota.set(y, quota.get(y) - by.length); seen.set(x, bx.length); seen.set(y, by.length);
    }
    const out = [];
    for (let b = 0; b < nb; b++) {
      const blk = fixed[b].slice();
      while (blk.length < PER_SCREEN) {
        let pick = null, best = null;
        for (const i of order) {
          if (blk.includes(i)) continue;
          if (blk.some(j => apart(i, j))) continue;          // a guard only: placing the pair first already keeps them apart
          const q = quota.get(i), c = blk.reduce((s, j) => s + (co.get(key(i, j)) || 0), 0);
          const score = [q > 0 ? 0 : 1, -q, c, seen.get(i)];          // has quota left, most left, fewest shared, least seen
          if (!best || lexLess(score, best)) { pick = i; best = score; }
        }
        blk.push(pick); quota.set(pick, quota.get(pick) - 1); seen.set(pick, seen.get(pick) + 1);
      }
      blk.forEach((i, x) => blk.slice(x + 1).forEach(j => co.set(key(i, j), (co.get(key(i, j)) || 0) + 1)));
      out.push(shuffleWith(blk, r));                                     // where each card sits on the screen
    }
    return out;
  }

  // Which cards are in the top and bottom sets: the "so me" and "not me" piles.
  function topSet(piles) { return VALUES.map(v => v.i).filter(i => piles[i] === SOME); }
  function bottomSet(piles) { return VALUES.map(v => v.i).filter(i => piles[i] === NOTME); }
  function pilesOk(piles) {
    const n = p => piles.filter(x => x === p).length;
    return piles.length === VALUES.length && piles.every(x => x >= 0 && x <= 3)
      && n(SOME) >= MIN_PILE && n(SOME) <= MAX_PILE && n(NOTME) >= MIN_PILE && n(NOTME) <= MAX_PILE;
  }

  // Most-and-least screens: each screen's picks are two positions on it, [up, down]. On the top screens up is "most like me" and
  // down "least"; on the bottom screens up is "least like me" and down "most", so on both, up pushes a card further toward its
  // end of the list. tally() counts the marks (shown on the results page); bwPairs() turns each screen into the comparisons it
  // holds: the up card beats the other three, and the other two beat the down card.
  function tally(scr, picks) {
    const t = new Map();
    scr.forEach((blk, b) => blk.forEach((i, pos) => {
      const x = t.get(i) || { up: 0, down: 0, shown: 0 }; x.shown++;
      if (picks[b] && picks[b][0] === pos) x.up++;
      if (picks[b] && picks[b][1] === pos) x.down++;
      t.set(i, x);
    }));
    return t;
  }
  function bwPairs(scr, picks) {
    const pairs = [];
    scr.forEach((blk, b) => {
      if (!picks[b]) return;
      const [u, d] = picks[b];
      blk.forEach((x, k) => { if (k !== u) pairs.push([blk[u], x]); if (k !== d && k !== u) pairs.push([x, blk[d]]); });
    });
    return pairs;
  }
  // A Bradley-Terry fit of [winner, loser] pairs (minorization-maximization, a fixed 200 rounds): each card's strength, so that
  // a beats b with chance s(a) / (s(a) + s(b)). Each card also gets half a win and half a loss against an average card, so a
  // card that won every time still has a finite strength.
  function bt(items, pairs) {
    const s = new Map(items.map(i => [i, 1])), sorted = items.slice().sort((a, b) => a - b);
    for (let it = 0; it < 200; it++) {
      for (const i of sorted) {
        let w = 0.5, d = 1 / (s.get(i) + 1);
        for (const [a, b] of pairs) {
          if (a === i) { w++; d += 1 / (s.get(a) + s.get(b)); } else if (b === i) d += 1 / (s.get(a) + s.get(b));
        }

  }
  const byStrength = s => (a, b) => (s.get(b) - s.get(a)) || (RANK_OF.get(a) - RANK_OF.get(b));

  // Face-offs, one at a time: each goes to the closest call near the edge of the five (the top 5, or the bottom 5), given
  // every answer so far. Returns the pairs as shown, for every answered face-off and the next one; which card comes first is
  // fixed by the pair. Most-and-least screens alone order a small set badly (with no noise at all, 4 screens per card put the
  // exact bottom 5 in order for 125 of 400 made-up players); a face-off settles exactly the comparison a screen leaves open.
  function faceoffs(items, basePairs, answers, count, salt) {
    const pairs = basePairs.slice(), asked = new Set(), seq = [];
    for (let d = 0; d < count; d++) {
      const s = bt(items, pairs), R = items.slice().sort(byStrength(s));
      let best = null;
      for (let a = 0; a < Math.min(8, R.length); a++) for (let b = a + 1; b < Math.min(a + 3, R.length, 9); b++) {
        const x = R[a], y = R[b], key = Math.min(x, y) + "," + Math.max(x, y);
        if (asked.has(key) || apart(x, y)) continue;
        const gap = Math.abs(Math.log(s.get(x)) - Math.log(s.get(y))) + (a <= 4 && b >= 5 ? 0 : 0.15) + 0.05 * (b - a - 1);
        if (!best || gap < best[0]) best = [gap, x, y, key];
      }
      if (!best) break;
      asked.add(best[3]);
      const r = seeded(setSeed([Math.min(best[1], best[2]), Math.max(best[1], best[2])]) ^ salt);
      const pair = r() < 0.5 ? [best[1], best[2]] : [best[2], best[1]];
      seq.push(pair);
      if (d >= answers.length) break;
      const w = answers[d] === 0 ? pair[0] : pair[1];
      pairs.push([w, w === pair[0] ? pair[1] : pair[0]]);
    }

  }
  // The top's face-offs ("if you could have just one") and the bottom's ("which could you more easily live without?").
  function duelSeq(piles, top, answers) { const T = topSet(piles); return faceoffs(T, bwPairs(screens(T, TOP_REPS), top), answers, DUELS, 0); }
  function bottomSeq(piles, bottom, answers) { const B = bottomSet(piles); return faceoffs(B, bwPairs(screens(B, BOTTOM_REPS), bottom), answers, BOTTOM_DUELS, 0x2c1b); }
  function withAnswers(pairs, seq, answers) {
    seq.slice(0, answers.length).forEach((pair, k) => { const w = answers[k] === 0 ? pair[0] : pair[1]; pairs.push([w, w === pair[0] ? pair[1] : pair[0]]); });
    return pairs;
  }

  // Everything the results page shows, from the answers alone.
  function result(ans) {
    const T = topSet(ans.piles), B = bottomSet(ans.piles);
    const ts = screens(T, TOP_REPS), t = tally(ts, ans.top), pairs = bwPairs(ts, ans.top);
    const seq = duelSeq(ans.piles, ans.top, ans.duels);
    const won = new Map(T.map(i => [i, { won: 0, of: 0 }]));
    seq.slice(0, ans.duels.length).forEach((pair, k) => {
      const w = ans.duels[k] === 0 ? pair[0] : pair[1], l = w === pair[0] ? pair[1] : pair[0];
      pairs.push([w, l]); won.get(w).won++; won.get(w).of++; won.get(l).of++;

    const sureness = i => { const p = vs(i, ranked[5]); return { p, word: p >= SURE ? "sure" : p >= LIKELY ? "likely" : "close call" }; };
    const evidence = i => ({ most: t.get(i).up, least: t.get(i).down, shown: t.get(i).shown, won: won.get(i).won, duels: won.get(i).of, ...sureness(i) });
    const close = ranked.slice(5, 8).filter(i => vs(i, ranked[4]) >= CLOSE);
    const sb = bt(B, withAnswers(bwPairs(screens(B, BOTTOM_REPS), ans.bottom), bottomSeq(ans.piles, ans.bottom, ans.bottomDuels), ans.bottomDuels));
    const bottom5 = B.slice().sort(byStrength(sb)).slice(0, 5);          // bottom picks are [least, most]; a face-off's winner is the easier to live without
    return { ranked, top5, close, bottom5, evidence, type: typeOf(top5, T, ans.hills, ans.die, ans.pick), areas: areaShares(ans.piles) };
  }

  // The hills' share of the type: a stance at either end of a hill adds HILL_PT to the area of the value that end leans on,
  // DIE_PT for a hill marked as one to die on, and no area takes more than HILL_CAP from the hills (the hills lean on some
  // areas more than others: eight ends lean into A fairer world, one into Joy). The middle stop holds both, and a pass says
  // nothing, so neither adds anything.
  const HILL_PT = 0.25, DIE_PT = 0.5, HILL_CAP = 1;
  function hillPoints(hills, die) {
    const pts = AREAS.map(() => 0), leans = [];

      const c = HILLS[h].lean[x === 1 ? 0 : 1], w = (die || []).includes(h) ? DIE_PT : HILL_PT;
      pts[VALUES[c].area] += w; leans.push({ hill: h, card: c, w });

  }
  // The type: points for each area from the top 5 (5, 4, 3, 2, 1 by place), half a point for each other "so me" card, and the
  // hills' points. The two areas with the most points make the type; when the second has under SOLO of the first, it's the
  // first area's pure type. The reasons come with it: the values that put the person in each area, from the sort, and the
  // values the hills leaned on there.
  // A close call: the type is a pair, the third area is past the pure-type line too, and it is within MARGIN points of the
  // second (one place in the top 5). Then both pairs are offered, the sort's reading first, and the player's pick names the
  // type; until there is a pick the sort's reading does, and a pick that is no longer one of the two on offer is dropped.
  const SOLO = 0.4, MARGIN = 1;
  function typeOf(top5, T, hills, die, pick) {
    const pts = AREAS.map(() => 0), bestPlace = AREAS.map(() => 99);
    top5.forEach((i, k) => { pts[VALUES[i].area] += 5 - k; bestPlace[VALUES[i].area] = Math.min(bestPlace[VALUES[i].area], k); });
    (T || []).filter(i => !top5.includes(i)).forEach(i => { pts[VALUES[i].area] += 0.5; });
    const hp = hillPoints(hills, die);
    hp.pts.forEach((x, a) => { pts[a] += x; });
    const order = AREAS.map((_, a) => a).sort((a, b) => (pts[b] - pts[a]) || (bestPlace[a] - bestPlace[b]) || (a - b));
    const [a, b, c] = order;
    const because = x => top5.filter(i => VALUES[i].area === x).concat((T || []).filter(i => !top5.includes(i) && VALUES[i].area === x)).slice(0, 3);
    const fromHills = x => [...new Set(hp.leans.filter(l => VALUES[l.card].area === x).map(l => l.card))];
    const base = { points: pts, hillPoints: hp.pts, leans: hp.leans };
    if (pts[b] < SOLO * pts[a]) return { name: PURE[a][0], line: PURE[a][1], areas: [a], because: [because(a)], hillsIn: [fromHills(a)], ...base, close: null };
    const pair = x => { const key = Math.min(a, x) + "-" + Math.max(a, x);
      return { name: PAIRS[key][0], line: PAIRS[key][1], areas: [a, x], because: [because(a), because(x)], hillsIn: [fromHills(a), fromHills(x)] }; };
    const offered = pts[c] >= SOLO * pts[a] && pts[b] - pts[c] <= MARGIN ? [b, c] : null;
    const picked = offered && offered.includes(pick) ? pick : null;
    const close = offered ? { first: a, options: offered.map(x => ({ area: x, ...pair(x) })), picked } : null;
    return { ...pair(picked === null ? b : picked), ...base, close };
  }

  // How much of each area is "you": the mean of its cards' piles, 0 (all "not me") to 100 (all "so me").
  function areaShares(piles) {
    return AREAS.map((_, a) => Math.round(100 * mean(VALUES.filter(v => v.area === a).map(v => piles[v.i])) / 3));
  }

  // --- the results code: every answer, so a friend's copy of the page can work out the same results -----------------------
  // Draft 5's codes start WF1. and carry the close-call pick after the name; draft 4's HH4. codes still read, with no pick.
  const PREFIX = "WF1.", OLD4 = "HH4.";
  const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  function encode(ans) {
    if (!pilesOk(ans.piles)) throw new Error("The sort isn't finished.");
    if (ans.duels.length !== DUELS || ans.bottomDuels.length !== BOTTOM_DUELS) throw new Error("The face-offs aren't finished.");
    const bits = [];
    const put = (v, n) => { for (let k = n - 1; k >= 0; k--) bits.push((v >> k) & 1); };
    ans.piles.forEach(x => put(x, 2));
    ans.top.forEach(([m, l]) => { put(m, 2); put(l, 2); });
    ans.duels.forEach(x => put(x, 1));
    ans.bottom.forEach(([l, m]) => { put(l, 2); put(m, 2); });
    ans.bottomDuels.forEach(x => put(x, 1));
    ans.hills.forEach(x => put(x === null || x === undefined ? 0 : x, 2));
    for (let k = 0; k < 3; k++) put(k < ans.die.length ? ans.die[k] : 31, 5);
    const chars = Array.from((ans.name || "").trim());           // whole characters, so an emoji is never cut in half
    while (new TextEncoder().encode(chars.join("")).length > 20) chars.pop();
    const name = new TextEncoder().encode(chars.join(""));
    put(name.length, 5); name.forEach(b => put(b, 8));
    put(ans.pick === null || ans.pick === undefined ? 0 : ans.pick + 1, 4);
    while (bits.length % 6) bits.push(0);
    let s = PREFIX;
    for (let k = 0; k < bits.length; k += 6) s += B64[bits.slice(k, k + 6).reduce((v, b) => v * 2 + b, 0)];
    return s;
  }
  function decode(code) {
    const c = String(code || "").trim(), v4 = c.startsWith(OLD4);
    if (/^(HH|WF)\d+\./.test(c) && !c.startsWith(PREFIX) && !v4) throw new Error("That code is from an earlier version of the test, so it can't be read here. Taking it again makes a new one.");
    if (!c.startsWith(PREFIX) && !v4) throw new Error("That doesn't look like a Wayfinder code. It should start with " + PREFIX);
    const bits = [];
    for (const ch of c.slice((v4 ? OLD4 : PREFIX).length)) { const v = B64.indexOf(ch); if (v < 0) throw new Error("The code has a character that doesn't belong in it: " + ch); for (let k = 5; k >= 0; k--) bits.push((v >> k) & 1); }
    let p = 0;
    const get = n => { if (p + n > bits.length) throw new Error("The code is cut short. Copy the whole thing and try again."); let v = 0; for (let k = 0; k < n; k++) v = v * 2 + bits[p++]; return v; };
    const bad = () => new Error("The code doesn't add up. It may have been changed by hand.");
    const piles = VALUES.map(() => get(2));
    if (!pilesOk(piles)) throw bad();
    const nTop = screens(topSet(piles), TOP_REPS).length, nBottom = screens(bottomSet(piles), BOTTOM_REPS).length;
    const pair = () => { const a = get(2), b = get(2); if (a === b) throw bad(); return [a, b]; };
    const top = Array.from({ length: nTop }, pair);
    const duelPicks = Array.from({ length: DUELS }, () => get(1));
    const bottom = Array.from({ length: nBottom }, pair);
    const bottomDuels = Array.from({ length: BOTTOM_DUELS }, () => get(1));
    const hills = HILLS.map(() => get(2));
    const die = [0, 1, 2].map(() => get(5)).filter(x => x !== 31);
    if (die.some(x => x >= HILLS.length || !hills[x]) || new Set(die).size !== die.length) throw bad();
    const len = get(5); if (len > 20) throw bad();
    const bytes = new Uint8Array(len); for (let k = 0; k < len; k++) bytes[k] = get(8);
    let name = "";
    try { name = new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch (e) { throw new Error("The name in the code is garbled."); }
    let pick = null;
    if (!v4) { const p = get(4); if (p > AREAS.length) throw bad(); pick = p ? p - 1 : null; }
    return { piles, top, duels: duelPicks, bottom, bottomDuels, hills, die, name, pick };
  }

  // --- comparing two people ---------------------------------------------------------------------------------------------
  function compare(a, b) {
    const ra = result(a), rb = result(b);
    const agree = Math.round(100 * (1 - mean(VALUES.map(v => Math.abs(a.piles[v.i] - b.piles[v.i]))) / 3));
    const word = AGREE.find(([lim]) => agree >= lim)[1];
    const sharedTop = ra.top5.filter(i => rb.top5.includes(i));
    const bothSoMe = topSet(a.piles).filter(i => b.piles[i] === SOME);
    const split = VALUES.filter(v => Math.abs(a.piles[v.i] - b.piles[v.i]) === 3).map(v => v.i);   // one says "so me", the other "not me"
    const both = HILLS.filter(h => a.hills[h.i] > 0 && b.hills[h.i] > 0);
    const same = both.filter(h => a.hills[h.i] === b.hills[h.i]).map(h => h.i);
    const opposite = both.filter(h => Math.abs(a.hills[h.i] - b.hills[h.i]) === 2).map(h => h.i);
    const bothDie = a.die.filter(i => b.die.includes(i));
    // Why two people split on a hill: the value each one's end leans on.
    const why = opposite.map(h => ({ hill: h, a: HILLS[h].lean[a.hills[h] === 1 ? 0 : 1], b: HILLS[h].lean[b.hills[h] === 1 ? 0 : 1] }));
    return { agree, word, sharedTop, bothSoMe, split, answeredBoth: both.length, same, opposite, why, bothDie, a: ra, b: rb };
  }

  const api = { AREAS, VALUES, WORLD, duelKind, GROUPS, HILLS, PER_HILL, HILL_PT, DIE_PT, HILL_CAP, SOLO, hillPoints, PURE, PAIRS, PILES, SOME, NOTME, MIN_PILE, MAX_PILE, TOP_REPS, BOTTOM_REPS, PER_SCREEN,
                DUELS, BOTTOM_DUELS, SURE, LIKELY, CLOSE, AGREE, ORDER, PREFIX, OLD4, MARGIN, KEEP_APART, apart, seeded, shuffled, screens, topSet, bottomSet, pilesOk, tally,
                bwPairs, bt, faceoffs, duelSeq, bottomSeq, result, typeOf, areaShares, encode, decode, compare, mean };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.HH = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// app.js: the page for Wayfinder, a values type test (draft 5). Uses window.HH from core.js. Answers are saved as they change: in this
// browser, and in the viewer's own private corner of the page's store when the page runs inside claude.ai with an account.
(function () {
  "use strict";
  const H = window.HH;
  const KEY = "hh.d4";
  const PER_HILL = H.PER_HILL, HILL_SCREENS = Math.ceil(H.HILLS.length / PER_HILL);
  const PILE_BTNS = [[3, "so me"], [2, "yes"], [1, "a little"], [0, "not me"]];
  const app = document.getElementById("app");

  const blank = () => ({ v: 4, step: "intro", page: 0, piles: Array(H.VALUES.length).fill(null), top: [], topFor: "", duels: [],
                         bottom: [], bottomFor: "", bottomDuels: [], hills: Array(H.HILLS.length).fill(null), die: [], pick: null,
                         name: "", mine: "", theirs: "", savedAt: 0, resetAt: 0 });
  function hasAnswers() { return S.piles.some(x => x !== null) || S.hills.some(x => x !== null); }
  function valid(s) {
    return s && s.v === 4 && Array.isArray(s.piles) && s.piles.length === H.VALUES.length && Array.isArray(s.hills)
      && s.hills.length === H.HILLS.length && Array.isArray(s.top) && Array.isArray(s.duels) && Array.isArray(s.bottom) && Array.isArray(s.bottomDuels);
  }

                el("span", { class: "bar-num", "data-who": x.k, text: String(x.r.areas[k]) })))))))),
      el("section", { class: "block" }, el("h3", { text: "Five you could each live without" }),
        cols("bottom", x => el("ol", { "data-who": x.k }, x.r.bottom5.map(i => item(i, other(x).r.bottom5.includes(i))))),
        el("p", { class: "sub", text: "Least first. Marked: in both. Low here doesn't mean against." })),
      el("section", { class: "block", "data-part": "hills" }, el("h3", { text: "Your hills" }),
        el("p", { class: "sub", text: `You both answered ${c.answeredBoth} of ${H.HILLS.length}: the same stop on ${c.same.length}, opposite ends on ${c.opposite.length}.`
          + (c.bothDie.length ? ` A hill you'd both die on: ${c.bothDie.map(i => H.HILLS[i].q).join(", ")}.` : "") }),
        ppl.map(x => el("p", { class: "sub die-line", "data-who": x.k }, el("b", { text: x.who }), " · ",
          x.p.die.length ? `Hills to die on: ${x.p.die.map(i => H.HILLS[i].q).join(", ")}.` : "No hills marked to die on.",
          hillAdds(x.r.type).length ? ` What the hills added to the type: ${list(hillAdds(x.r.type).map(([v, ar]) => `${H.AREAS[ar].name} +${v}`))}.` : "")),
        c.why.length ? el("ul", { class: "why" }, c.why.map(w => el("li", {}, el("b", { text: H.HILLS[w.hill].q + ": " }),
          `${an} leaned on ${V(w.a).name}, ${bn} on ${V(w.b).name}.`))) : null,
        legend(an, bn, true),
        stanceMap(a, b, an, bn)));
  }
  // Who is which colour: squares for the chart's bars, dots for the hills (a filled dot and a ring, as on each hill's line).
  function legend(an, bn, dots) {
    return el("p", { class: "cmp-legend" }, el("span", { class: dots ? "key me" : "key sq ka", "aria-hidden": "true" }), an,
      el("span", { class: dots ? "key them" : "key sq kb", "aria-hidden": "true" }), bn);
  }

  // --- render -------------------------------------------------------------------------------------------------------------
  function render() {
    refresh = null; whereNote = null; erasing = false;
    if (shared) {
      let shown;
      try { shown = sharedView(shared); } catch (e) { shown = sharedError(e && e.message ? e.message : "Something in it didn't add up."); }
      app.replaceChildren(shown);
      return;
    }
    let view;
    try {
      switch (S.step) {
        case "sort": view = sort(Math.min(S.page, H.ORDER.length - 1)); break;
        case "narrow": view = NARROW[S.page] && NARROW[S.page].need() ? narrow(S.page) : (setTimeout(narrowNext, 0), el("p", { text: "One moment…" })); break;
        case "top": view = sortDone() ? (syncSets(), bwScreen("top", Math.min(S.page, topScreens().length - 1))) : (setTimeout(resume, 0), el("p", { text: "One moment…" })); break;
        case "duel": view = topDone() && S.page <= S.duels.length ? duelScreen("duel", S.page) : (setTimeout(resume, 0), el("p", { text: "One moment…" })); break;
        case "bottom": view = duelsDone() ? (syncSets(), bwScreen("bottom", Math.min(S.page, bottomScreens().length - 1))) : (setTimeout(resume, 0), el("p", { text: "One moment…" })); break;
        case "bduel": view = bottomDone() && S.page <= S.bottomDuels.length ? duelScreen("bduel", S.page) : (setTimeout(resume, 0), el("p", { text: "One moment…" })); break;
        case "hills": view = hills(Math.min(S.page, HILL_SCREENS - 1)); break;
        case "results": view = results(); break;
        case "compare": view = compareScreen(); break;
        default: view = intro();
      }
    } catch (e) {
      view = el("section", { class: "screen" }, el("h2", { text: "Something went wrong on this screen." }),
        el("p", { class: "sub", text: "Your answers are still saved. " + (e && e.message ? e.message : "") }),
        el("div", { class: "row-btns" }, el("button", { type: "button", class: "btn primary", text: "Pick up where I left off", onclick: () => resume() })));
    }
    app.replaceChildren(view);
    if (hasAnswers()) app.append(resetBar());
  }
  render();
})();

</script>
</body>
</html>
